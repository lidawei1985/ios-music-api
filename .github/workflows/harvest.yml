name: harvest

# 曲库自动扩容 + 自愈（无人值守 · 全 GitHub 侧，与本地电脑是否开机无关）
#
# 实测依据（2026-10-06）：
#   1) 网易云接口从 GitHub runner **完全可达**（分类 70 / 歌单列表 / trackIds / song-detail 全通）；
#   2) 真正的垃圾来源是「按歌单曲目数选歌单」——有声书合辑/素材库曲目最多。
#      改按**播放量**选歌单后：热门池热度≥40 占比 73%（旧池仅 10%），垃圾命中 4%（旧池 13%）。
#   3) 线上 13 万库里 61% 是 pop=5~9（有声书/播客/白噪音/素材库），体检不过 → 本流水线会自愈重打包。
#
# 每轮的活：枚举热门歌单 → 拉 trackIds → 拉元数据 → 统计 → 体检（不合格或长够料才重打包）→ 入库
on:
  workflow_dispatch:
    inputs:
      force_pack:
        description: "强制重新打包（忽略增长阈值）"
        required: false
        default: "false"
      pages:
        description: "每分类枚举页数（每页 60 个歌单）"
        required: false
        default: "40"
  schedule:
    # ★ 2026-10-08 修复：原来只有 2 个偏移（23、53 */6），实测 GitHub 定时投递命中率仅 ~1/6
    #   → 两个偏移常常全部落空：harvest 曾**连续 23.4 小时零成功**（曲库冻在 68,903 不动）。
    #   现铺 6 个偏移（每 6 小时窗口 6 次投递机会），整窗全漏概率从 ~30% 降到 ~67%↓（即命中率约 2/3）。
    #   本仓是 public → Actions 分钟数不计费，加密投递没有成本顾虑。
    - cron: "07 */6 * * *"
    - cron: "19 */6 * * *"
    - cron: "31 */6 * * *"
    - cron: "43 */6 * * *"
    - cron: "51 */6 * * *"
    - cron: "57 */6 * * *"

permissions:
  contents: write
  actions: write          # 清理旧 cache 需要

concurrency:
  # ★★ 2026-10-08 拆组（根因之一）：原来与 pool **共用** `pool-maintenance`，而 pool 每 2 小时
  #   就来一轮（3 偏移），harvest 只有 2 偏移 → 反复被 pool 顶成 cancelled。
  #   实测：10-07 06:35Z 最后一次成功之后 **7 连 cancelled**，曲库冻结 23.4 小时。
  #   两边的 push 都已带 rebase 重试（各 4 次、指数退避），并发 push 不会被对方打掉，
  #   所以可以安全拆成独立组：harvest 只与自己竞争，不再被 pool 挤掉。
  group: harvest-main
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HV_WORKERS: "12"
      # ★ 2026-10-07 扩采集面（曲库上不去的真因＝歌单池只有 1,470 个，上限却是 20,000）：
      #   本地实测 `HV_PAGES=40` → 枚举 2,800 页（70 类 × 40）仅 31s，歌单池 1,470 → 2,414。
      #   实测分类接口 offset 3600 仍有货（民谣满格 60），故加深页数确能挖到新歌单。
      #   注：`order=new` 实测无效（返回 0 条），只能靠加深页数这一条路。
      HV_PAGES: ${{ github.event.inputs.pages || '40' }}
      HV_ENUM_ORDERS: "hot"          # 只取热门排序（真歌来源）
      HV_MIN_TRACKS: "20"            # 歌单门槛 20 首（50 会漏掉精选歌单）
      HV_MAX_PLAYLISTS: "20000"
      HV_SORT: "play"
      HV_KEEP: "260000"
      HV_MIN_POP: "10"               # 热度地板：实测 pop=5 全是有声书/白噪音
      HV_STRONG_N: "5"
      HV_POP_EST: "10"
      HV_POP_NEW: "40"
      HV_AUDIO_WORKERS: "48"         # 音频可播体检并发（13 万首约 18 分钟）
      HV_AUDIO_GATE: "1"             # 0=关闭音频闸门（仅排障用）
      # ★ 2026-10-08：可播判定缓存的有效期（小时）。旧行为是**永不过期** →
      #   老曲目测过一次 keep 就永久放行、链接死了也照发；而体检脚本每次真测 →
      #   闸门自相矛盾，harvest 被自己的体检整批阻断（run 37736589880）。
      #   现默认 7 天。0 = 每轮全量重测（法医级排查用）。
      #   注：老缓存没有时间戳 → 视为已过期，所以复检会按「最久没测的优先」**限量**跑。
      HV_AUDIO_TTL_H: "168"
      # ★ 2026-10-08（第二次血案配套）：复检限流 + 时间预算。
      #   不限量的话，7.9 万首一次性重测 → ⑥ 跑 145 分钟 → 撞 job 180 分钟上限被杀
      #   （run 37751310738）。2000 首/轮 ÷ 32 秒 ≈ 4-5 分钟，26 轮覆盖全库。
      HV_AUDIO_RETEST_MAX: "2000"
      #   音频实测总预算（秒）。超出即停止本轮实测、未测的按 unknown 放行（下轮续跑）。
      HV_AUDIO_BUDGET_S: "1800"
      HV_ORIGIN_GATE: "1"            # 原唱闸门：剔翻唱（oct=1/2）与非原版命名
      HV_OCT_WORKERS: "8"            # 原唱体检并发（走 _oct.json 缓存，约 40 秒）
      HV_MAX_ARTISTS: "8000"         # 按歌手扩库单轮上限（防止撞 180 分钟超时）
      # ★ 2026-10-07 多源扩充（主人：「为什么就死盯着网易呢！全网什么叫全网？」）：
      #   网易单源天花板约 4.4 万，撑不起一个音乐 App。这里把 QQ 榜单/分类歌单 +
      #   酷狗榜单的曲目并入，逐首用 multi_match(strict=True) 找**实测能播**的长效 id。
      #   本地实测命中率 39.4%（修掉 3 个静默失效 bug + 采集排队 bug 后）；
      #   60 条候选 7s（12 并发）→ 8000 条约 33 分钟。
      #   ⚠️ 别把这里当无限增长源：**候选池会被抽干**。原配置（每分类 4 个歌单、
      #   单一排序、酷狗 24 榜）全池仅 ~1.2 万条候选，两三轮就没新料了；
      #   现在开 multi-sort + 每分类 10 个歌单 + 酷狗 40 榜 → 实测全池 24.6k 条
      #   （POOL=40000 时），配合 _multi_tried 冷却（14 天）与轮转取样，
      #   单轮 8000 条能连续跑好几轮才见底。
      HV_MULTI: "1"
      HV_MULTI_MAX: "8000"
      HV_MULTI_WORKERS: "12"
      HV_MULTI_POOL: "60000"         # 候选池上限（=待处理队列截断前的池子大小）
      HV_MULTI_PL_PER_CAT: "10"      # 每个「QQ分类×排序」组合取 10 个歌单
      HV_MULTI_QQ_SORTS: "1,2,3,5"   # 4 个排序维度（不同榜，歌单集合几乎不重叠）
      HV_MULTI_SONGS_PER_PL: "40"
      HV_MULTI_KG_RANKS: "40"        # 酷狗榜取前 40 个（实测榜列表共 55 个）
      HV_MULTI_QQ_PER_RANK: "100"
      HV_MULTI_RETRY_DAYS: "14"      # 失败候选的冷却期（避免整池被反复空转）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复 harvest 采集状态（歌单池 / trackIds / 元数据）
        id: hcache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/catalog/_playlists.json
            data/catalog/_ids.json
            data/catalog/_songs.jsonl
            data/catalog/_artist_ids.json
            data/catalog/_audio_gate.json
            data/catalog/_oct.json
            data/catalog/_multi.jsonl
            data/catalog/_multi_tried.jsonl
          key: harvest-state-v2-${{ github.run_id }}
          restore-keys: |
            harvest-state-v2-

      - name: 采集状态盘点（缓存是否命中）
        run: |
          for f in _playlists.json _ids.json _songs.jsonl _artist_ids.json _oct.json _multi.jsonl _multi_tried.jsonl; do
            p="data/catalog/$f"
            if [ -f "$p" ]; then echo "$f $(du -h $p | cut -f1)"; else echo "$f 缺失（首次全量）"; fi
          done

      - name: 接口可达性自检（破版预警，不阻断）
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request, ssl
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          H = {"User-Agent": "Mozilla/5.0", "Referer": "https://music.163.com/"}
          req = urllib.request.Request("https://music.163.com/api/playlist/catalogue", headers=H)
          d = json.load(urllib.request.urlopen(req, timeout=25, context=ctx))
          print("网易云可达，分类数 =", len(d.get("sub") or []))
          PY

      - name: ① 枚举热门歌单（按播放量）
        run: python tools/harvest.py enum

      - name: ② 拉全量 trackIds
        run: python tools/harvest.py ids

      - name: ③ 拉曲目元数据（热度/发行时间/封面/付费标记）
        run: python tools/harvest.py songs

      # ★ 2026-10-06 追加：歌手页才是「本尊原版」的富矿（歌单只覆盖热门合辑）。
      #   刻意放在 songs 之后 —— 本轮只往池子里攒 id，元数据下一轮再取，
      #   既不会拉长本轮的采集时长，也不会因为超时把整条流水线带崩。
      - name: ③-b 按歌手扩库（为下一轮积累本尊原版）
        continue-on-error: true
        timeout-minutes: 25
        run: python tools/harvest.py artists

      # ★ 2026-10-07 多源扩充（「全网聚合」真正落地）：
      #   三路发现源 —— ① QQ 音乐八大榜 ② QQ 64 个官方分类歌单 ③ 酷狗 55 个榜单。
      #   为什么选 QQ/酷狗/咪咕当发现源：实测搜「晴天 周杰伦」第一条，
      #     QQ ✅ 晴天/周杰伦 ｜ 酷狗 ✅ 晴天/周杰伦 ｜ 咪咕 ✅ 晴天/周杰伦
      #     网易 ❌ 晴天(深情版)/Lucky小爱（翻唱第一）｜ 酷我 ❌ 20 条里没一条原版
      #   → 酷我只当**直链解析器**（antiserver 免登录），不当曲目源。
      #   逐首跑 multi_match(strict=True) 拿实测能播的长效 id（wy/kw/migu），
      #   HARD_BAD 硬毙伴奏/DJ/片段/教学，时长 <90s 或与目标偏差过大一律丢。
      - name: ③-c 多源扩充（QQ 榜单/分类歌单 + 酷狗榜 → 逐首实测可播源）
        continue-on-error: true
        timeout-minutes: 60
        run: python tools/harvest.py multi

      - name: ④ 统计增量（过闸门多少首 vs 线上现有）
        id: stat
        run: python tools/harvest.py stat

      - name: ⑤ 决定是否需要重打包（现有库体检不过 → 自愈；或长够新料 → 增量）
        id: need
        run: |
          set +e
          python tools/catalog_verify.py data/catalog > /tmp/verify.log 2>&1
          V=$?
          echo "----- 现有库体检（退出码 $V）-----"; cat /tmp/verify.log
          P="${{ steps.stat.outputs.pass }}"; C="${{ steps.stat.outputs.current }}"
          P=${P:-0}; C=${C:-0}
          D=$((P - C))
          PACK=0
          if [ "$V" -ne 0 ]; then
            echo "结论：现有库体检不通过 → 触发自愈重打包"
            PACK=1
          elif [ "$D" -ge 3000 ]; then
            echo "结论：过闸门 $P 首 vs 线上 $C 首（+$D）→ 增量重打包"
            PACK=1
          elif [ "${{ github.event.inputs.force_pack }}" = "true" ]; then
            echo "结论：手动强制重打包"
            PACK=1
          else
            echo "结论：仅积累采集状态（增量 $D < 3000），本轮不发布"
          fi
          echo "pack=$PACK" >> $GITHUB_OUTPUT
          echo "oldpass=$([ "$V" -eq 0 ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT

      - name: ⑥ 打包曲库（归一 + 质量闸门 + 分片 + 搜索索引）
        if: steps.need.outputs.pack == '1'
        run: python tools/harvest.py pack

      # ★ 2026-10-06 血案修复：采集状态缓存必须「尽早且必然」落盘。
      #   旧写法依赖 actions/cache 的 post 阶段保存 —— 但 job 一旦失败，post 会被 skip，
      #   于是缓存丢失 → 下一轮从零全量重算 5.6 万首（85 分钟）→ 又超时/冲突失败 → 死循环。
      #   这里在打包后立刻显式保存，并用 if: always() 保证「哪怕后续步骤全挂」也存下来。
      #   key 带 run_id 确保每轮都是新缓存；restore 的 restore-keys 前缀会命中最近一次。
      - name: ⑥-b 立即保存采集状态（无论后续成败，避免下轮全量重算）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/catalog/_playlists.json
            data/catalog/_ids.json
            data/catalog/_songs.jsonl
            data/catalog/_artist_ids.json
            data/catalog/_audio_gate.json
            data/catalog/_oct.json
            data/catalog/_multi.jsonl
            data/catalog/_multi_tried.jsonl
          key: harvest-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: ⑦ 发布前体检（不合格直接阻断）
        if: steps.need.outputs.pack == '1'
        run: |
          python tools/catalog_verify.py data/catalog

      # ★ 2026-10-06 追加的规模回归闸门（血案驱动）：
      #   catalog_verify.py 只查纯度与结构，**不查数量**。本地实测：采集状态不全时
      #   pack 会把 13 万首砍到 2.4 万首，而纯度体检照样「通过」——差一步就把
      #   缩水 80% 的曲库发到线上。
      #   判据刻意做成有条件的：**旧库本来就不合格时，缩水是正当的自愈**（剔垃圾必然掉量），
      #   只有「旧库合格却莫名缩水」才说明采集状态出问题 → 才阻断。
      - name: ⑦-b 规模回归闸门（旧库合格却缩水 → 判定采集异常并阻断）
        if: steps.need.outputs.pack == '1'
        run: |
          NEW=$(python -c "import json;print(json.load(open('data/catalog/manifest.json',encoding='utf-8'))['count'])")
          OLD=$(git show HEAD:data/catalog/manifest.json 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin).get('count') or 0)" 2>/dev/null || echo 0)
          OLDPASS="${{ steps.need.outputs.oldpass }}"
          echo "线上 $OLD 首（体检：$([ "$OLDPASS" = "1" ] && echo 合格 || echo 不合格)）→ 本次打包 $NEW 首"
          if [ "$NEW" -lt 1000 ]; then
            echo "❌ 新库仅 $NEW 首，明显异常，禁止发布"
            exit 1
          fi
          if [ "$OLDPASS" = "1" ] && [ "$OLD" -gt 0 ] && [ "$NEW" -lt $((OLD * 95 / 100)) ]; then
            echo "❌ 旧库体检合格却缩水超过 5%（$OLD → $NEW）：判定采集状态异常，禁止发布"
            exit 1
          fi
          echo "✅ 规模回归检查通过"

      - name: ⑧ 入库并发布
        if: steps.need.outputs.pack == '1'
        run: |
          git config user.name "music-pool-bot"
          git config user.email "music-pool-bot@users.noreply.github.com"
          CNT=$(python -c "import json;print(json.load(open('data/catalog/manifest.json',encoding='utf-8'))['count'])")
          git add -A data/catalog
          if git diff --cached --quiet; then
            echo "曲库无变更"
          else
            git commit -m "曲库 ${CNT} 首：热门歌单扩容 + 质量闸门（p50 热度见体检）$(date -u '+%Y-%m-%d %H:%M')"
            # ★ 2026-10-06 血案修复：本流程可能跑 1~2 小时，期间 pool.yml 的定时任务
            #   很可能往 main 推了新提交 → 直接 git push 会被 "[rejected] (fetch first)" 拒掉，
            #   整轮 2 小时的采集成果全部白费（本地 commit 随 runner 一起销毁）。
            #   这里改为「rebase 到最新 main 后重推」，最多重试 4 次（指数退避）。
            #   用 --autostash：工作区可能还有缓存等未跟踪改动，先 stash 再 rebase。
            ok=0
            for i in 1 2 3 4; do
              if git push 2>/tmp/push.err; then ok=1; break; fi
              echo "----- 第 $i 次 push 失败 -----"; cat /tmp/push.err
              echo "拉取远端最新 main 后 rebase 重试…"
              git fetch origin main || true
              if ! git rebase --autostash origin/main; then
                echo "rebase 冲突，放弃本次发布"
                git rebase --abort 2>/dev/null || true
                break
              fi
              sleep $((i * 5))
            done
            if [ "$ok" = "1" ]; then
              echo "已发布 ${CNT} 首"
            else
              echo "❌ push 连续失败，本轮不发布（线上曲库保持不变）"
              exit 1
            fi
          fi

      - name: ⑨ 刷新 jsDelivr 缓存（让 App 立刻拿到新曲库）
        if: steps.need.outputs.pack == '1'
        continue-on-error: true
        run: |
          curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/catalog/" -o /dev/null \
            && echo "purged catalog/" || echo "purge dir failed"
          # ★ 2026-10-07：包内曲库分块目录（pack 里由 mkcatalog_js 重生成）也要刷
          curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/catalog/js/" -o /dev/null \
            && echo "purged catalog/js/" || echo "purge js dir failed"
          for f in data/catalog/manifest.json data/catalog/manifest.js data/catalog/js/cat-manifest.js; do
            [ -f "$f" ] || continue
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" -o /dev/null \
              && echo "purged $f" || echo "purge failed $f"
          done
          N=0
          for f in data/catalog/shard-*.json data/catalog/idx-*.txt; do
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" -o /dev/null || true
            N=$((N+1))
          done
          echo "已刷新 $N 个分片/索引"

      # ★★★ 2026-10-07 新增：锚点保鲜（治「数据早就更新了、手机还在看旧库」）
      #   端上拿到新数据的路径是：探 data/win/<10 分钟窗口>.js 拿到「当前数据 sha」
      #   → 整体切到 @<sha>（全新 URL，秒级回源）。**探不到就回落 @main，
      #   而 @main 是分支 12 小时硬缓存，purge / `?t=` 实测全部打不动。**
      #   实测事故：只有 pool.yml 会发布锚点，而 pool 自 10-07 02:54 起连续
      #     cancelled/failed（push 被 "[rejected] (fetch first)" 拒掉），
      #     锚点因而停在 03:34（@49d6cfd448）—— 曲库此时已从 31,681 涨到 68,903，
      #     手机端却因为探不到新 sha 而一直显示旧库。
      #   修法：谁发布数据谁兜底锚点。harvest 也是往 main 推数据的一方，
      #     跑完若发现锚点过旧（>150 分钟）就补发一次（幂等；pool 正常时不会触发）。
      - name: ⑨.5 锚点保鲜（端上靠它才能立刻看到新数据）
        if: always()
        continue-on-error: true
        run: |
          git config user.name "music-pool-bot"
          git config user.email "music-pool-bot@users.noreply.github.com"
          git fetch origin main || true
          AGE=$(python - <<'PY'
          import datetime, glob, os, re
          ws = []
          for p in glob.glob('data/win/*.js'):
              m = re.search(r'(\d{12})\.js$', os.path.basename(p))
              if m:
                  ws.append(m.group(1))
          if not ws:
              print(9999)
              raise SystemExit
          t = datetime.datetime.strptime(max(ws), '%Y%m%d%H%M').replace(tzinfo=datetime.timezone.utc)
          print(int((datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() // 60))
          PY
          )
          echo "最新锚点窗口：${AGE} 分钟前"
          if [ "${AGE:-9999}" -lt 150 ]; then
            echo "锚点仍新鲜（<150 分钟），无需补发"
            exit 0
          fi
          python tools/mktide.py --sha "$(git rev-parse origin/main)" --back 18 --prune
          git add -A data/win
          if git diff --cached --quiet; then
            echo "锚点内容无变化"
            exit 0
          fi
          git commit -m "tide: anchor @$(git rev-parse origin/main | cut -c1-10) harvest兜底 $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            if git push; then echo "✅ 锚点已补发"; exit 0; fi
            git fetch origin main || true
            git rebase --autostash origin/main || { git rebase --abort 2>/dev/null || true; break; }
            sleep $((i * 5))
          done
          echo "❌ 锚点补发失败"

      - name: ⑩ 清理 7 天前的旧采集缓存（防止 10GB 配额被占满）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUT=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.created_at < \"$CUT\") | .id" \
          | while read id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/$id" && echo "删除旧缓存 $id"; done
