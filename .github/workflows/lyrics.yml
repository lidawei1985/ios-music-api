name: lyrics

# LRCLIB 歌词补齐流水线（无人值守 · 全 GitHub 侧）
#
# ============================ 为什么在云端跑，不在手机上查 ============================
# 2026-10-22 本机（国内家宽）实测：
#     · lrclib.net/api/get 单请求 5.8s；40 首串行跑 15 分钟没跑完
#     · 并发 6 → 22×URLError(RST) + 18×503，等于被当场打回
#   → 「边播边查」在端上是不可能的（歌都放完了还在转圈）。
#   所以：Actions（海外网络）串行预取 → data/lyrics/ 分片 → jsDelivr → 端上读静态分片。
#   端上只在分片缺这首歌时，才用原生 fetch 兜底查一次（带缓存，失败静默）。
#
# ============================ 官方 fair-use（照做，别撞限流）============================
#     · 串行 + 间隔 200~500ms；已标识 UA 约 90 次/分，本流水线自己限到 80
#     · UA 必须带应用名+版本+项目页
#     · 429 必须遵守 Retry-After（脚本里已加 30% 抖动）
#     · /api/get 的 duration 容差只有 ±2s → 默认不传（曲库时长不准，传了反而 404）
#     · /api/search 实测 34.7s 超时，彻底不用
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多查多少首（留空=按预算跑）"
        required: false
        default: ""
      budget:
        description: "本轮时间预算（秒）"
        required: false
        default: "2400"
  schedule:
    # 每天 4 个偏移，跟 harvest 一样铺多次提高定时投递命中率
    - cron: "23 3 * * *"
    - cron: "37 9 * * *"
    - cron: "41 15 * * *"
    - cron: "29 21 * * *"

permissions:
  contents: write

concurrency:
  group: lyrics-main
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 盘点现状（曲库多少首 / 已有多少歌词）
        run: |
          python - <<'PY'
          import json, os
          cat = json.load(open("data/catalog/manifest.json", encoding="utf-8"))
          print("曲库 %d 首 / %d 片" % (cat["count"], len(cat["shards"])))
          p = "data/lyrics/manifest.json"
          if os.path.exists(p):
              m = json.load(open(p, encoding="utf-8"))
              print("已有歌词 %d 条 / %d 片（%s）" % (m["count"], len(m["shards"]), m["updated"]))
          else:
              print("还没有歌词分片，本轮从零开始")
          PY

      - name: 接口自检（拿不到就早退，别白跑 40 分钟）
        run: |
          python - <<'PY'
          import json, sys, urllib.parse, urllib.request
          UA = {"User-Agent": "DawgeMusic/1.0.0 (https://github.com/lidawei1985/ios-music-app)"}
          q = urllib.parse.urlencode({"artist_name": "周杰伦", "track_name": "稻香"})
          try:
              with urllib.request.urlopen(
                      urllib.request.Request("https://lrclib.net/api/get?" + q, headers=UA),
                      timeout=25) as r:
                  d = json.loads(r.read().decode())
              print("✅ 可达：%s / %s ｜ synced=%s ｜ %d 行" % (
                  d.get("artistName"), d.get("trackName"), bool(d.get("syncedLyrics")),
                  len((d.get("syncedLyrics") or "").splitlines())))
          except Exception as e:
              print("❌ lrclib 不可达：%r" % (e,))
              sys.exit(1)
          PY

      - name: 补齐歌词（串行 + 限速 + 时间预算）
        run: |
          set -o pipefail
          LIMIT="${{ github.event.inputs.limit }}"
          BUDGET="${{ github.event.inputs.budget || '2400' }}"
          ARGS="--top 20000 --budget ${BUDGET:-2400} --rpm 80"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "python tools/lyrics.py $ARGS"
          python tools/lyrics.py $ARGS 2>&1 | tee /tmp/lyrics.log
          echo "----- 尾部统计 -----"
          grep -E "命中|累计|落盘" /tmp/lyrics.log | tail -6

      - name: 提交并发布
        run: |
          git config user.name "lyrics-bot"
          git config user.email "lyrics-bot@users.noreply.github.com"
          if [ ! -f data/lyrics/manifest.json ]; then
            echo "没有歌词产物，跳过"
            exit 0
          fi
          CNT=$(python -c "import json;print(json.load(open('data/lyrics/manifest.json',encoding='utf-8'))['count'])")
          git add -A data/lyrics
          if git diff --cached --quiet; then
            echo "歌词无变更（本轮到时间预算但没新增，或全部命中已存在）"
            exit 0
          fi
          if ! git commit -m "lyrics: ${CNT} 首带时间轴歌词（LRCLIB 对齐）$(date -u '+%Y-%m-%d %H:%M')"; then
            echo "❌ commit 失败"
            exit 1
          fi
          ok=0
          for i in 1 2 3 4; do
            if git push 2>/tmp/push.err; then
              RS=$(git ls-remote origin refs/heads/main 2>/dev/null | awk '{print $1}')
              LH=$(git rev-parse HEAD)
              if [ -n "$RS" ] && [ "$RS" = "$LH" ]; then ok=1; break; fi
              echo "push 返回 0 但远端 ≠ 本地（空跑）"
            fi
            echo "----- 第 $i 次 push 失败 -----"; cat /tmp/push.err
            git fetch origin main || true
            if ! git rebase --autostash origin/main; then
              echo "rebase 冲突，放弃"; git rebase --abort 2>/dev/null || true; break
            fi
            sleep $((i * 5))
          done
          if [ "$ok" = "1" ]; then echo "✅ 已发布 ${CNT} 首歌词"; else echo "❌ push 失败"; exit 1; fi

      - name: 刷新 jsDelivr 缓存
        continue-on-error: true
        run: |
          curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/lyrics/" -o /dev/null || true
          echo "purged data/lyrics/"

      - name: 摘要
        if: always()
        run: |
          {
            echo "### LRCLIB 补齐结果"
            echo ""
            if [ -f data/lyrics/manifest.json ]; then
              python - <<'PY'
              import json
              m = json.load(open("data/lyrics/manifest.json", encoding="utf-8"))
              print("- 累计歌词 **%d** 条 / %d 片" % (m["count"], len(m["shards"])))
              print("- 更新时间 `%s`" % m["updated"])
              PY
            else
              echo "- 无产物"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
