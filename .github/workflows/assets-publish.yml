name: assets

# 图片资产分仓（lidawei1985/dwg-assets）的**手动补发**入口。
#
# ★ 2026-10-10 起常规发布已由 pool.yml 接管（它在开头 pull-in、末尾 publish），
#   本 workflow 因此**去掉了定时**，只留 workflow_dispatch —— 用途是「图片没同步上去时手动补一发」。
#   带定时会每 2 小时空跑一次并报错（主仓已不跟踪 data/assets，checkout 出来是空的）。
#
# 与主仓的关系：主仓不再跟踪 data/assets，图片的真源就是 dwg-assets 本身。
#   所以这里先 pull-in（把分仓克隆到 data/assets），再就地 publish。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 写入图片分仓部署密钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ASSETS_DEPLOY_KEY }}" > ~/.ssh/dwg_assets
          chmod 600 ~/.ssh/dwg_assets
          test -s ~/.ssh/dwg_assets && echo "部署密钥已就位 $(wc -c < ~/.ssh/dwg_assets) 字节"

      - name: 拉取图片分仓（dwg-assets → data/assets）
        env:
          ASSETS_KEY_FILE: /home/runner/.ssh/dwg_assets
        run: python3 tools/asset_repo.py pull-in

      - name: 提交并推送（就地模式）
        env:
          ASSETS_KEY_FILE: /home/runner/.ssh/dwg_assets
          ASSET_WORK: ${{ github.workspace }}/data/assets
        run: python3 tools/asset_repo.py publish --yes
