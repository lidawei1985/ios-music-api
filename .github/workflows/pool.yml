name: pool

# 源池自动维护（无人值守 · 全公网）
#   每 2 小时：体检所有源 → 打分分档 → 自动升降权 → 沉淀自有歌库 → 产出 pool/charts/library
#   产出物走本仓 + jsDelivr，App 只认自家地址；与本地电脑是否开机无关。
on:
  workflow_dispatch:
    inputs:
      probes:
        description: "探针曲数量（默认全部）"
        required: false
        default: ""
      src_ids:
        description: "参与体检的源（逗号分隔，默认全部）"
        required: false
        default: ""
  schedule:
    # UTC，每 2 小时窗口内挂 6 个偏移、并向窗口后半段铺：
    #   GitHub 定时投递实测只有 ~1/6 命中，3 个偏移时「整窗全漏」概率高达 ~58% ——
    #   10-08 实测就撞上了：02:17/02:37/02:57 与 04:17/04:37/04:57 **六个槽全部未投递** → 5 小时空档。
    #   现改 6 个偏移（每偶数小时 :07/:27/:47 + 每奇数小时 :07/:27/:47 ≈ 每小时 3 次机会），
    #   整窗全漏概率降到 ~33%，且后半段仍有机会 → 就算首轮跑得久，也能再拿一次真正的刷新。
    #   冗余偏移由「新鲜度守卫（<70 分钟跳过）」去重，不会重复干活。
    - cron: "07 */2 * * *"
    - cron: "27 */2 * * *"
    - cron: "47 */2 * * *"
    - cron: "07 1-23/2 * * *"
    - cron: "27 1-23/2 * * *"
    - cron: "47 1-23/2 * * *"

permissions:
  contents: write

concurrency:
  group: pool-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # ★★ 2026-10-08 40 → 90 分钟（解冻封面本地化后必须抬，否则整轮会被掐死）
    #   实测基线（10-08 两轮成功）：整轮只跑 **9 分钟**，其中「图片本地化」步骤 **仅 2 秒**
    #     —— 因为门控 bug 让它每轮 new=0 秒退（修前现场 count=46177 new=0 deferred=36292）。
    #   解冻后该步骤会真正跑到 LZ_BUDGET_S 的 **1500s（25 分钟）**，
    #   再叠加下游「源池维护流水线」(build.py) 的最坏预算 TXT 1500s + MV 600s = 2100s，
    #   合计最坏 ≈ 62 分钟 > 旧的 40 分钟 → **job 超时被杀 → 发布步骤永不执行 → 整轮成果全丢**
    #   （外部只看到"数据不更新了"，极难排查）。抬到 90 分钟留足余量。
    timeout-minutes: 90
    steps:
      # ★★★ 用 deploy key 检出（与 ios 仓同一改动，2026-10-06）：
      #   实测 GITHUB_TOKEN 推送的提交**不触发 jsDelivr 的 push webhook** ——
      #   CDN 只能等分支缓存 12 小时自然过期（实测 @main 卡在旧内容）；
      #   真凭据（SSH deploy key）推送则秒级回源（实测推完立即取到新 count）。
      #   本仓是端上「推送后想立刻看到」的主体（曲库/索引/封面），所以这里收益最大。
      #   ssh-key 为空时 checkout 自动回落 https，不会因缺 secret 失败
      #   （但那样数据更新要等 12 小时才可见）。
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装取色依赖（Pillow，用于主视觉主色预计算）
        run: python -m pip install --quiet --disable-pip-version-check Pillow

      - name: 适配器自检（破版预警，不阻断）
        continue-on-error: true
        run: python tools/adapters.py 稻香 周杰伦

      # ★ 2026-10-06 新增：图片本地化沉淀（增量）。
      #   「把别人的 URL 变成自己的 WebP」—— 上游改域名/加防盗链与我们无关。
      #   分层策略：CV_LIB_TOP 控制曲库封面覆盖到热度第几名。
      #   实测：4 万首 → 33306 张唯一封面 ≈ 485MB（WebP 均值 14.9KB/张），
      #   压在 asset_guard 的 700MB 安全线内。
      #   ★ 为什么不走 Releases：实测 Releases 直链下载只有 228B/s~4.6KB/s，
      #     端上刷不出图；而 gcore.jsdelivr 实测 22KB/s 可用 → 热图必须走仓库。
      - name: 图片本地化沉淀（增量：头像 / KV / 封面 / 分类 / 曲库分层）
        continue-on-error: true
        env:
          CV_LIB_TOP: "40000"        # 曲库封面覆盖热度前 4 万首（约 485MB）
          LZ_WORKERS: "16"
          LZ_MAX_NEW: "6000"         # 每轮新增上限，攒量靠多轮
          LZ_BUDGET_S: "1500"        # 单轮时间预算（job 上限已抬到 90 分钟，留足余量）
        run: python tools/localize.py localize

      # ★★★ 2026-10-07 新增：孤儿图清理（结构性根治「cv/ 顶到 700MB 安全线」）。
      #   根因：图片是**内容寻址**命名（文件名 = sha1(内容)[:16]）——
      #   上游一旦换图（同歌手新头像、同歌换封面），新图落地拿到新文件名，
      #   而**旧文件没有任何人删它**，会永远躺在 data/assets/cv/ 并被 git 永久记账。
      #   实测证据（2026-10-07 本机盘点）：
      #     cv/ 磁盘 38287 张 ｜ 索引仅引用 20860 张 → **孤儿 17427 张 / 300.4MB**
      #     （占该目录 47%），把 cv/ 顶到 639.7MB，逼近 asset_guard 的 700MB 安全线
      #     → 不做这一步，**下一轮 harvest 的「入库并发布」必被自己的守卫阻断**。
      #   安全性（为什么敢在 CI 里自动删）：
      #     · 判据与同文件的 localize 写索引**同源**（都用 <kind>.json 的 map values 取 basename），
      #       顺序上 localize 刚写完索引 → 这里读到的就是同一份最新事实，不会错判；
      #     · 索引为空 → localize.py 内部**直接拒绝执行**（绝不全删）；
      #     · 只删 SPEC 三个 kind 目录下的 .webp，绝不动其他文件；
      #     · 删除前落 assets/prune.log 留痕；
      #     · 被删文件必是**上一轮已 commit 进 git** 的，随时可从历史找回。
      #   位置：放在 asset_guard 之前，让守卫量到的是「清理后」的真实体量。
      - name: 孤儿图清理（索引已不引用的旧封面）
        continue-on-error: true
        run: python tools/localize.py prune --yes

      # ★ 补一份 JS 版索引：端上是 file:// 页面，WebView 拦 fetch/XHR、不拦 <script>，
      #   索引只给 .json 的话端上永远拿不到（图下好了也认不出文件名）。
      #   localize 自己也会写，这里再跑一次只为「本轮 localize 因故早退」时兜底 —— 幂等、秒级。
      - name: 导出端上可用的 JS 版图片索引（assets/*.js）
        continue-on-error: true
        run: python tools/localize.py mkjs

      # ★ 契约门禁：端上 app.html 的 skey() 与采集器 localize.py 的 _js_skey()
      #   必须**逐字符一致** —— 一旦哪边改歪，键全体错位、图下好了端上一张也查不到
      #   （现象只是"封面没变本地图"，不报错不崩溃，极难排查）。
      #   实现来源：本机跑时现场从 kernel/app.html 抽真身；云端只 checkout 了 cloud 仓，
      #   于是退回 tools/skey_contract.json 快照（内核那三行 + 内核指纹，入库）。
      #   用例 15 条含 emoji / 非 BMP / 超长 / 空值。不一致 → 阻断发布。
      - name: skey 契约回归（封面键能不能对上）
        run: python tools/verify_skey.py

      - name: 新鲜度守卫（上轮数据 <70 分钟则跳过本轮，防冗余偏移重复跑）
        id: fresh
        run: |
          python - <<'PY'
          import json, os, datetime
          skip = False
          try:
              u = json.load(open('data/streams.json', encoding='utf-8')).get('updated', '')
              t = datetime.datetime.strptime(u, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)
              age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 60
              skip = age < 70
              print(f'上轮数据 {age:.0f} 分钟前 -> {"跳过" if skip else "开跑"}')
          except Exception as e:
              print('守卫读取失败，照常跑:', e)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('skip=%s\n' % ('true' if skip else 'false'))
          PY

      - name: 源池维护流水线
        if: github.event_name == 'workflow_dispatch' || steps.fresh.outputs.skip != 'true'
        env:
          PROBES_LIMIT: ${{ github.event.inputs.probes }}
          SRC_IDS: ${{ github.event.inputs.src_ids }}
          HERO_N: "24"
          # ★★★ 2026-10-07 MV 扩量（主人点名「MV 和演唱会弄了吗？」）：
          #   病灶是「官方 MV」那条腿只关键词搜索榜单前 20 首 → 只有 12 条，
          #   而全库扫描出的 3000 条真 MV 里剩 2400 条全躺池子里没人用。
          #   现在五档全部从池子取，并把全库扫描上限从 3000/800 提到 8000/1500、
          #   翻页从 120 页提到 200 页、时间预算从 300s 提到 600s（job 上限 40 分钟，够）。
          MV_BUDGET_S: "600"          # MV 抓取时间预算（秒）
          MV_BULK_PAGES: "200"        # 全库翻页上限（每页 50 条 → 最多 1 万条原始）
          MV_POOL_MV: "8000"          # 真 MV 池上限
          MV_POOL_LIVE: "1500"        # 真现场池上限
          MV_SEL_N: "600"             # ① 精选 MV
          MV_LIVE_N: "600"            # ② 演唱会 Live
          MV_OFF_N: "1500"            # ③ 官方 MV（从池续取）
          MV_HOT_N: "1500"            # ④ 热门 MV（从池续取）
          MV_LIVE2_N: "300"           # ⑤ 现场 Live（从池续取）
          # 2026-10-06 扩歌词覆盖：主人点名「词不同步不对版」。
          # 原为默认 320 首/轮，攒了多轮才 1290 首（覆盖率 1.2%），
          # 绝大多数歌只能靠运行时实时拉取 —— 一旦桥不稳就是「没词/错词」。
          # 上调到 1200 首/轮 + 预算 1500s，让离线库稳定追上曲库规模。
          LYRIC_TOP: "1200"
          COMMENT_TOP: "400"
          TXT_BUDGET_S: "1500"
        run: python tools/build.py

      # ★★★ 2026-10-06 补齐关键一环：把 data/<n>.json 同步导出 data/<n>.js。
      #   端上是 file:// 页面，iOS WebView **拦 fetch / XHR，只放行 <script>**；
      #   内核 fetchLive() 已改走 <script> 注入 window.__DWG_DB_<NAME>。
      #   少了这一步，CI 里新产出的曲库/榜单**端上永远拉不到**（图下好了也没数据）。
      - name: 导出端上可用的 JS 版数据（data/*.js）
        if: github.event_name == 'workflow_dispatch' || steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: python tools/mkdata_js.py

      - name: 产出校验（必须有可播源 + 非空歌库 + 主视觉≥20）
        if: github.event_name == 'workflow_dispatch' || steps.fresh.outputs.skip != 'true'
        run: python tools/validate.py

      # ★ 2026-10-06 新增：图片沉淀体量守卫。
      #   本流水线每轮会往 data/assets/ 落 WebP（头像/KV/封面/曲库封面），
      #   而 GitHub 仓库硬限 1GB **超了直接拒 push**，届时整轮成果全丢且很难排查
      #   （表面现象只是"数据不更新了"）。这里在 push 前把住，超限就阻断本轮发布，
      #   线上保持上一版可用数据 —— 宁可这轮不发，也不能把仓库搞废。
      - name: 图片沉淀体量守卫（防仓库爆仓）
        if: github.event_name == 'workflow_dispatch' || steps.fresh.outputs.skip != 'true'
        run: python tools/asset_guard.py

      - name: 入库并发布
        id: publish
        run: |
          git config user.name "music-pool-bot"
          git config user.email "music-pool-bot@users.noreply.github.com"
          ROUND=$(python -c "import json;print(json.load(open('data/pool.json',encoding='utf-8'))['round'])")
          git add -A data
          PUSH_OK=1
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "pool: round ${ROUND} $(date -u '+%Y-%m-%d %H:%M')"
            # ★★★ 2026-10-07 血案修复（与 harvest.yml ⑧ 同款实现，两处保持一致）：
            #   本流水线会跑 20~40 分钟，期间 harvest 很可能往 main 推了曲库 →
            #   裸 `git push` 会被 "[rejected] (fetch first)" 拒掉，后果有两层：
            #     ① 本轮 pool 成果白费；
            #     ② **后面的「时效锚点」步骤被连带跳过** → 端上探不到新 sha →
            #        回落 @main（分支 12 小时硬缓存，purge/`?t=` 实测都打不动）→
            #        现象就是「数据早更新了，手机看到的还是旧曲库」。
            #   实测证据（2026-10-07）：02:54 之后 pool 多轮 cancelled/failed，
            #     最后一个成功锚点停在 03:34（ed8da18e @49d6cfd448）；
            #     而曲库此时已从 31,681 涨到 68,903 → 端上只能看到旧库。
            #   修法：rebase 到最新 main 后重推，最多 4 次（指数退避）。
            PUSH_OK=0
            for i in 1 2 3 4; do
              if git push 2>/tmp/push.err; then PUSH_OK=1; break; fi
              echo "----- 第 $i 次 push 失败 -----"; cat /tmp/push.err
              echo "拉取远端最新 main 后 rebase 重试…"
              git fetch origin main || true
              if ! git rebase --autostash origin/main; then
                echo "rebase 冲突，放弃本次发布"
                git rebase --abort 2>/dev/null || true
                break
              fi
              sleep $((i * 5))
            done
          fi
          if [ "$PUSH_OK" = "0" ]; then
            # 本轮不发布（线上保持上一版）：丢掉未推的本地提交，避免锚点提交把它捎带上去
            echo "❌ push 连续失败：本轮数据不发布（线上保持上一版）"
            git reset --hard origin/main 2>/dev/null || true
          fi
          # ★ 锚点必须指向「远端 main 上真实存在的提交」——即使本轮推送失败也要刷新锚点，
          #   让端上切到「当前线上最新」而不是 @main 的 12 小时旧缓存（宁可慢，不能断）。
          git fetch origin main >/dev/null 2>&1 || true
          SHA=$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "push_ok=$PUSH_OK" >> "$GITHUB_OUTPUT"

      # ★★★ 时效锚点：把刚推上去的数据提交 sha 写成一个「10 分钟窗口命名」的小文件。
      #   为什么非要它（实测判决）：
      #     jsDelivr **按 URL 缓存** —— @main 这类老 URL 吃 12 小时分支硬缓存，
      #     purge / ?t= 全部打不动；而**全新 URL**（新文件名 / 新 commit sha）立即回源。
      #     端上要拿「刚推的 sha」，可拿 sha 本身也要一个能秒到的 URL ——
      #     用每 10 分钟换一次的窗口文件名破局：data/win/202610070000.js。
      #   必须**两段提交**：锚点里写的是数据提交的 sha，而 sha 提交完才知道（先有鸡先有蛋）。
      #   端上探到 sha → 索引/数据切到 @<sha>（秒级）；探不到 → 回落 @main（慢 12 小时，功能不受影响）。
      #   ★ 2026-10-07 关键修订：加 `--back 18` —— **一次回填 18 个窗口（3 小时）**。
      #     原来只写「当前这一个 10 分钟窗口」，锚点就只存在于「CI 恰好跑过的那一刻」，
      #     端上探窗口 0 大概率落空，只能往历史一个个试 → 白烧探测预算，锚点静默失效。
      #     回填后：只要 CI 3 小时内跑过，端上探**任意窗口**都能命中 → 1~2 秒拿到 sha。
      #     代价：每次 CI 多写 18 个 64 字节小文件（同名覆盖，仓库几乎不涨）。
      - name: 发布时效锚点（data/win/<10分钟窗口>.js）
        if: steps.publish.outputs.sha != ''
        run: |
          git config user.name "music-pool-bot"
          git config user.email "music-pool-bot@users.noreply.github.com"
          python tools/mktide.py --sha "${{ steps.publish.outputs.sha }}" --back 18 --prune
          git add -A data/win
          if git diff --cached --quiet; then
            echo "锚点无变化（同窗口内重复跑，URL 相同、内容相同）"
          else
            git commit -m "tide: anchor @$(echo ${{ steps.publish.outputs.sha }} | cut -c1-10) $(date -u '+%Y-%m-%d %H:%M')"
            # ★ 2026-10-07：锚点这一步是**端上能否立刻看到新数据的唯一命门**，
            #   所以它的 push 也必须带 rebase 重试（原为裸 push，一被拒整步作废）。
            TIDE_OK=0
            for i in 1 2 3 4; do
              if git push 2>/tmp/push.err; then TIDE_OK=1; break; fi
              echo "----- 锚点第 $i 次 push 失败 -----"; cat /tmp/push.err
              git fetch origin main || true
              if ! git rebase --autostash origin/main; then
                echo "锚点 rebase 冲突，放弃本次发布"
                git rebase --abort 2>/dev/null || true
                break
              fi
              sleep $((i * 5))
            done
            if [ "$TIDE_OK" != "1" ]; then
              echo "❌ 时效锚点发布失败：端上本轮无法切到新数据（会回落 @main 旧缓存）"
              exit 1
            fi
          fi
          echo "锚点已发布：https://gcore.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/win/<窗口>.js"

      - name: 刷新 jsDelivr 缓存（★ 对分支无效 —— 留作痕迹，数据时效已由锚点解决）
        continue-on-error: true
        run: |
          # ★★ 2026-10-06 实证结论：purge **对分支引用无效**。
          #   依据 jsDelivr 官方文档："Valid semver releases must be used for purge to work"，
          #   且 "Branches - 12 hours"（分支引用硬缓存 12 小时，到期自然过期）。
          #   实测：对 @main 打 purge 回 200，但 20 分钟后 gcore 节点仍在发两代前的版本
          #   （同一时刻 cdn 节点已是新版）→ 这几行一直是安慰剂，留着只为「万一将来官方改行为」。
          #
          # ★★★ 端上「推完马上就能看到新数据」靠的**不是 purge，而是时效锚点**：
          #   上一步发布的 data/win/<窗口>.js，URL 天生是新的 → 必然回源；
          #   端上 probeTide() 拿到 sha 后，索引/数据整体切到 @<sha>（全新 URL → 秒级）。
          #   图片仍走 @main：诉求是「图要在我们自己这儿、永不因上游挂掉而白屏」，
          #   不是「分钟级可见」，且端上有 <img> 直连 + 上游 URL 兜底，不会白屏。
          for f in pool.json charts.json library.json artists.json mv.json hero.json \
                   assets/av.json assets/kv.json assets/cv.json assets/manifest.json \
                   assets/av.js assets/kv.js assets/cv.js \
                   pool.js charts.js library.js artists.js mv.js hero.js; do
            curl -sS --max-time 25 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/$f" -o /dev/null \
              && echo "purged $f" || echo "purge failed $f"
          done
          curl -sS --max-time 25 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/pool.json" | head -c 400

      # ★ 2026-10-07 新增：发布结果硬校验（禁止「静默失败」）
      #   上面把 push 失败做成「不 abort、只记 push_ok=0」，好处是**后面的锚点步骤照样会跑**
      #   （否则一次 push 被拒会把「刷新时效锚点」这步一起带走 → 端上直接失明、手机永远旧库）；
      #   代价是这一轮看着像绿的 —— 所以在这里把它翻回红灯，绝不静默。
      - name: 发布结果硬校验（本轮是否真的发布成功）
        if: always()
        run: |
          if [ "${{ steps.publish.outputs.push_ok }}" != "1" ]; then
            echo "❌ 本轮 pool 发布失败：push_ok=${{ steps.publish.outputs.push_ok }}（数据未上线，仅锚点已刷新）"
            exit 1
          fi
          echo "✅ 本轮发布成功"
